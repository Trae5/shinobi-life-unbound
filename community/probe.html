<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title></head><body><pre id="out">starting...</pre>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var CFG={apiKey:'AIzaSyA6EnB41g34TnhhLNJcx8OA2vmTrShwoi4',authDomain:'shinobi-life-unbound.firebaseapp.com',projectId:'shinobi-life-unbound',storageBucket:'shinobi-life-unbound.firebasestorage.app',messagingSenderId:'231893959325',appId:'1:231893959325:web:4dc77151958863c51b0a74'};
var app=firebase.initializeApp(CFG,'probe'),auth=app.auth(),db=app.firestore();
var out=document.getElementById('out');var L=[];
function log(s){L.push(s);out.textContent=L.join('\n')}
auth.onAuthStateChanged(function(u){
 if(!u){auth.signInAnonymously().catch(function(e){log('AUTH FAIL: '+e.code)});return}
 log('AUTH OK uid='+u.uid);
 var tests=[
  ['saves/probe_x9','doc'],
  ['community_bugs','col'],
  ['config/probe_x9','doc'],
  ['players/probe_x9','doc'],
  ['global/probe_x9','doc'],
  ['community/probe_x9','doc'],
  ['chat/probe_x9','doc']
 ];
 (async function(){
  for(var i=0;i<tests.length;i++){var p=tests[i][0];
   try{await db.doc(p).get();log(p+' READ ok')}catch(e){log(p+' READ deny ('+e.code+')')}
   try{await db.doc(p).set({probe:true,when:new Date().toISOString()});log(p+' WRITE ok');try{await db.doc(p).delete();log(p+' DELETE ok')}catch(e){log(p+' DELETE deny')}}catch(e){log(p+' WRITE deny ('+e.code+')')}
   await new Promise(function(r){setTimeout(r,150)});
  }
  try{var s=await db.collection('saves').limit(1).get();log('collection saves LIST ok ('+s.size+')')}catch(e){log('collection saves LIST deny')}
  log('PROBE DONE');
 })();
});
</script></body></html>
