<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi Owner Panel</title>
<style>
*{box-sizing:border-box}body{background:#0c0d11;color:#e9e5e8;font:16px system-ui;max-width:1180px;margin:auto;padding:clamp(16px,3vw,32px)}h1,h2{color:#f4f0f1}h1{font-size:clamp(1.55rem,4vw,2.4rem);letter-spacing:.04em}section{background:#17181e;border:1px solid #44262d;border-radius:14px;padding:20px;box-shadow:0 8px 30px #0004}input,button{font:inherit;padding:10px;border-radius:8px}input{background:#0d0e13;color:#fff;border:1px solid #59323a;max-width:100%}button{cursor:pointer;background:#991e35;color:#fff;border:1px solid #c93a53;margin:4px}button:hover{background:#ba2942}a{color:#f07787}#status{color:#e8a6ad}#panel[hidden],#login[hidden],.save[hidden]{display:none!important}#panel{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:16px}#panel section{min-width:0}#saves{max-height:65vh;overflow:auto}.save{border:1px solid #3c2930;background:#101116;border-radius:10px;margin:10px 0;padding:14px;overflow-wrap:anywhere}.save p{margin:0 0 10px}.save pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;background:#090a0d;padding:12px;border-radius:8px;font-size:12px}.save summary{cursor:pointer;color:#f07787;margin-top:10px}#search{width:100%;margin:12px 0 2px}@media(max-width:720px){#panel{grid-template-columns:1fr}#form label{display:block;margin:10px 0}#form input{display:block;width:100%}}
</style></head><body><h1>SHINOBI: LIFE UNBOUND</h1><p>Owner panel · <a href="./">Return to game</a></p><p id="status">Loading Firebase…</p><section id="login" hidden><h2>Owner sign in</h2><form id="form"><label>Email <input id="email" type="email" autocomplete="username" required></label> <label>Password <input id="password" type="password" autocomplete="current-password" required></label> <button>Sign in</button></form></section><div id="panel" hidden><section><button id="signout">Sign out</button><h2>Maintenance</h2><p id="maintenance">Loading…</p><button id="enable">Turn maintenance on</button><button id="disable">Turn maintenance off</button></section><section><h2>Player saves</h2><button id="refresh">Refresh</button><input id="search" type="search" placeholder="Search player name or ID" aria-label="Search player name or ID"><div id="saves"></div></section></div>
<script>
(function(){
  var boot=window.ownerBoot={stage:'loading the Firebase SDK',done:false};
  var timer=setTimeout(function(){if(!boot.done)document.getElementById('status').textContent='Firebase is taking too long while '+boot.stage+'. Check your connection and access to www.gstatic.com, then reload.'},15000);
  boot.complete=function(){boot.done=true;clearTimeout(timer)};
  boot.fail=function(message){boot.complete();document.getElementById('status').textContent=message};
})();
</script>
<script>
(async()=>{
  const boot=window.ownerBoot, $=id=>document.getElementById(id), status=m=>$('status').textContent=m;
  const owner='Gb2MYzFu5sV2Rr8d1cGWMI90K4e2', ownerEmail='mr.ricklocc3893@gmail.com', config={apiKey:'AIzaSyA6EnB41g34TnhhLNJcx8OA2vmTrShwoi4',authDomain:'shinobi-life-unbound.firebaseapp.com',projectId:'shinobi-life-unbound',storageBucket:'shinobi-life-unbound.firebasestorage.app',messagingSenderId:'231893959325',appId:'1:231893959325:web:4dc77151958863c51b0a74'};
  function loadScript(name){return new Promise((resolve,reject)=>{const s=document.createElement('script');let timer;const finish=error=>{clearTimeout(timer);s.onload=s.onerror=null;if(error){s.remove();reject(error)}else resolve()};s.src='https://www.gstatic.com/firebasejs/10.14.1/firebase-'+name+'-compat.js';s.onload=()=>finish();s.onerror=()=>finish(new Error('Could not load '+name+' compat SDK'));timer=setTimeout(()=>finish(new Error('Timed out loading '+name+' compat SDK')),10000);document.head.append(s)})}
  try{
    for(const name of ['app','auth','firestore']){boot.stage='loading Firebase '+name+' compat SDK';await loadScript(name)}
    const f=window.firebase;
    if(!f||f.SDK_VERSION!=='10.14.1'||typeof f.auth!=='function'||typeof f.firestore!=='function')throw new Error('Compatible Firebase SDK components or version missing');
    boot.stage='initializing compatible Firebase authentication';
    const app=f.initializeApp(config), auth=app.auth(), db=app.firestore();
    const signInWithEmailAndPassword=(a,email,password)=>a.signInWithEmailAndPassword(email,password);
    const signOut=a=>a.signOut(), onAuthStateChanged=(a,next,error)=>a.onAuthStateChanged(next,error);
    const setPersistence=(a,p)=>a.setPersistence(p), browserLocalPersistence=f.auth.Auth.Persistence.LOCAL;
    const collection=(d,path)=>d.collection(path), getDocs=ref=>ref.get(), doc=(d,...path)=>d.doc(path.join('/'));
    const getDoc=async ref=>{const snapshot=await ref.get();return {exists:()=>snapshot.exists,data:()=>snapshot.data()}};
    const setDoc=(ref,data)=>ref.set(data,{merge:true}), updateDoc=(ref,data)=>ref.update(data), deleteField=()=>f.firestore.FieldValue.delete();
    let ownerReady=false, nonOwnerNotice='';
    $('form').onsubmit=async e=>{e.preventDefault();nonOwnerNotice='';try{status('Signing in…');await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';}catch(e){$('password').value='';status('Sign-in failed: '+(e.code||e.message))}};
    boot.stage='waiting for the initial authentication state';
    onAuthStateChanged(auth,async user=>{boot.complete();ownerReady=false;$('panel').hidden=true;$('login').hidden=false;if(user){try{const token=await user.getIdTokenResult();if(auth.currentUser!==user)return;ownerReady=user.uid===owner&&user.email===ownerEmail&&token.claims.email===ownerEmail&&token.claims.firebase&&token.claims.firebase.sign_in_provider==='password'}catch(e){status('Could not verify owner sign-in: '+(e.code||e.message));return}}$('panel').hidden=!ownerReady;$('login').hidden=ownerReady;if(user&&!ownerReady){nonOwnerNotice='This account is not the email/password owner.';status(nonOwnerNotice);try{await signOut(auth)}catch(e){status('Could not sign out non-owner account: '+(e.code||e.message))}return}if(!ownerReady){status(nonOwnerNotice||'Sign in with the owner account.');return}nonOwnerNotice='';status('Signed in as owner.');await refresh()},e=>boot.fail('Authentication initialization failed: '+(e.code||e.message)+'. Reload to try again.'));
    $('signout').onclick=()=>signOut(auth).catch(e=>status('Sign-out failed: '+(e.code||e.message)));$('refresh').onclick=refresh;
    function filter(){const q=$('search').value.trim().toLowerCase();$('saves').querySelectorAll('.save').forEach(row=>{row.hidden=!row.dataset.search.includes(q)})}
    $('search').addEventListener('input',filter);
    async function refresh(){if(!ownerReady)return;try{const cfg=await getDoc(doc(db,'config','maintenance'));$('maintenance').textContent=cfg.exists()&&cfg.data().enabled===true?'Maintenance is ON.':'Maintenance is OFF.';const all=await getDocs(collection(db,'saves')), box=$('saves');box.replaceChildren();let count=0;all.forEach(d=>{const data=d.data(), slots=data.slots||{};Object.keys(slots).forEach(key=>{const s=slots[key], g=s&&s.g||{}, row=document.createElement('div'), text=document.createElement('p'), btn=document.createElement('button'), details=document.createElement('details'), summary=document.createElement('summary'), pre=document.createElement('pre');row.className='save';text.textContent='Player '+d.id+' · Slot '+key+' · '+(g.name||[g.first,g.last].filter(Boolean).join(' ')||'Unknown')+' · Age '+(g.age??'?')+' · Updated '+(s.when||data.updatedAt||'unknown');row.dataset.search=text.textContent.toLowerCase();summary.textContent='View full player save (as of refresh)';pre.textContent=JSON.stringify(data,null,2);details.append(summary,pre);btn.textContent='Delete slot';btn.onclick=async()=>{if(!confirm('First confirmation: permanently delete slot '+key+' for player '+d.id+'?'))return;if(!confirm('Final confirmation: delete this slot? This cannot be undone.'))return;try{await updateDoc(doc(db,'saves',d.id),{['slots.'+key]:deleteField()});await refresh()}catch(e){status('Delete failed: '+e.message)}};row.append(text,btn,details);box.append(row);count++})});if(!count)box.textContent='No saved slots found.';filter()}catch(e){status('Could not load panel: '+e.message)}}
    async function setMaintenance(enabled){try{await setDoc(doc(db,'config','maintenance'),{enabled});await refresh();status(enabled?'Maintenance enabled.':'Maintenance disabled.')}catch(e){status('Maintenance update failed: '+e.message)}}$('enable').onclick=()=>setMaintenance(true);$('disable').onclick=()=>setMaintenance(false);
  }catch(e){boot.fail('Firebase initialization failed while '+boot.stage+': '+(e.code||e.message||'Unknown error')+'. Check your connection and reload.')}
})();
</script></body></html>
