<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi Owner Panel</title><style>body{background:#10090c;color:#f2dfbc;font:16px system-ui;max-width:900px;margin:auto;padding:24px}h1,h2{color:#dfb963}section{background:#211218;border:1px solid #a47d3b;border-radius:12px;padding:20px;margin:16px 0}input,button{font:inherit;padding:10px;border-radius:6px}input{background:#10090c;color:#fff;border:1px solid #a47d3b}button{cursor:pointer;background:#711c2d;color:#fff;border:1px solid #d4af65;margin:4px}a{color:#dfb963}.save{border-top:1px solid #654d37;padding:12px 0;overflow-wrap:anywhere}#status{color:#ffd381}</style></head><body><h1>SHINOBI: LIFE UNBOUND</h1><p>Owner panel · <a href="./">Return to game</a></p><p id="status">Loading Firebase…</p><section id="login"><h2>Owner sign in</h2><form id="form"><label>Email <input id="email" type="email" autocomplete="username" required></label> <label>Password <input id="password" type="password" autocomplete="current-password" required></label> <button>Sign in</button></form></section><div id="panel" hidden><section><button id="signout">Sign out</button><h2>Maintenance</h2><p id="maintenance">Loading…</p><button id="enable">Turn maintenance on</button><button id="disable">Turn maintenance off</button></section><section><h2>Player saves</h2><button id="refresh">Refresh</button><div id="saves"></div></section></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs,doc,getDoc,setDoc,updateDoc,deleteField} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const owner='Gb2MYzFu5sV2Rr8d1cGWMI90K4e2', app=initializeApp({apiKey:'AIzaSyA6EnB41g34TnhhLNJcx8OA2vmTrShwoi4',authDomain:'shinobi-life-unbound.firebaseapp.com',projectId:'shinobi-life-unbound',storageBucket:'shinobi-life-unbound.firebasestorage.app',messagingSenderId:'231893959325',appId:'1:231893959325:web:4dc77151958863c51b0a74'}), auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id), status=m=>$('status').textContent=m; let ownerReady=false;
$('form').onsubmit=async e=>{e.preventDefault();try{status('Signing in…');await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';}catch(e){status('Sign-in failed: '+e.message)}};
onAuthStateChanged(auth,async user=>{ownerReady=!!user&&user.uid===owner;$('panel').hidden=!ownerReady;$('login').hidden=ownerReady;if(user&&!ownerReady){await signOut(auth);status('This account is not the owner.');return}if(!ownerReady){status('Sign in with the owner account.');return}status('Signed in as owner.');await refresh()});
$('signout').onclick=()=>signOut(auth);$('refresh').onclick=refresh;
async function refresh(){if(!ownerReady)return;try{const cfg=await getDoc(doc(db,'config','maintenance'));$('maintenance').textContent=cfg.exists()&&cfg.data().enabled===true?'Maintenance is ON.':'Maintenance is OFF.';const all=await getDocs(collection(db,'saves')), box=$('saves');box.replaceChildren();let count=0;all.forEach(d=>{const slots=d.data().slots||{};Object.keys(slots).forEach(key=>{const s=slots[key], g=s&&s.g||{}, row=document.createElement('div'), text=document.createElement('p'), btn=document.createElement('button');row.className='save';text.textContent='Player '+d.id+' · Slot '+key+' · '+(g.name||[g.first,g.last].filter(Boolean).join(' ')||'Unknown')+' · Age '+(g.age??'?')+' · Updated '+(s.when||d.data().updatedAt||'unknown');btn.textContent='Delete slot';btn.onclick=async()=>{if(!confirm('Delete slot '+key+' for player '+d.id+'?'))return;try{await updateDoc(doc(db,'saves',d.id),{['slots.'+key]:deleteField()});await refresh()}catch(e){status('Delete failed: '+e.message)}};row.append(text,btn);box.append(row);count++})});if(!count)box.textContent='No saved slots found.'}catch(e){status('Could not load panel: '+e.message)}}
async function setMaintenance(enabled){try{await setDoc(doc(db,'config','maintenance'),{enabled});await refresh();status(enabled?'Maintenance enabled.':'Maintenance disabled.')}catch(e){status('Maintenance update failed: '+e.message)}}$('enable').onclick=()=>setMaintenance(true);$('disable').onclick=()=>setMaintenance(false);
</script></body></html>
